case: sp500_2008_lehman_dropout
tool: get_index_constituents
description: >
  S&P 500 membership must be point-in-time: Lehman Brothers (LEH) is a constituent as known
  on 2008-09-15 (its last day in the index) and absent as known on 2008-09-16 (effective
  removal). Survivorship bias would wrongly omit LEH from the earlier date.
provenance: |
  Lehman Brothers filed for Chapter 11 on 2008-09-15 and was removed from the S&P 500
  effective 2008-09-16 (replaced by Harris Corp), per the S&P 500 component-change record
  (source: wikipedia reconstruction; ptdata membership valid range [1957-03-04, 2008-09-16)).
  A point-in-time constituents query must include LEH on dates when it was a member and
  exclude it on/after the effective removal date — the falsifiable boundary is 09-15 vs 09-16.
steps:
  - request: {index: SP500, as_of_date: "2008-09-15"}   # last day as an S&P 500 member
    expect:
      - {path: tickers, op: contains, value: LEH}
  - request: {index: SP500, as_of_date: "2008-09-16"}   # effective removal date
    expect:
      - {path: tickers, op: not_contains, value: LEH}
cross:
  # The two queries must genuinely differ on LEH (the falsifiable point-in-time claim).
  - {left: "0.tickers", op: ne, right: "1.tickers"}
lineage_required: true
