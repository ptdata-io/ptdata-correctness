case: enron_2001_q3_10q
tool: get_fundamentals
description: >
  Enron Q3 2001 fundamentals as known in mid-November 2001 must return the figures as reported
  at the time, with lineage to the Q3 10-Q — not values implied by the later forensic unwinding.
  This is a PARSED pre-XBRL fact (no XBRL existed in 2001), served as a labeled confidence tier.
provenance: |
  Enron filed its Q3 2001 Form 10-Q on 2001-11-19 (EDGAR CIK 0001024401, accession
  0000950129-01-504218); it declared bankruptcy on 2001-12-02. The consolidated income statement
  ("In Millions") reports, for the three months ended 2001-09-30: Revenues $46,877M and a Net
  Income (Loss) of $(644)M — the loss that began the collapse. These figures are extracted from
  the filing text (provenance=parsed) and human-verified against the primary document
  (extraction_confidence=verified). A point-in-time query as of 2001-11-20 returns exactly these.
request:
  ticker: ENE
  as_of_date: "2001-11-20"
  metrics: [revenue, net_income]
  fiscal_year: 2001
  fiscal_period: Q3
expect:
  - {path: metrics.revenue.fiscal_year, op: eq, value: 2001}
  - {path: metrics.revenue.fiscal_period, op: eq, value: Q3}
  - {path: metrics.revenue.value, op: eq, value: 46877000000,
     source: "Enron Q3 2001 10-Q, consolidated income statement (in millions)"}
  - {path: metrics.revenue.provenance, op: eq, value: parsed}
  - {path: metrics.revenue.extraction_confidence, op: eq, value: verified}
  - {path: metrics.revenue.source_accession, op: eq, value: "0000950129-01-504218"}
  - {path: metrics.net_income.value, op: eq, value: -644000000,
     source: "Q3 2001 consolidated Net Income (Loss)"}
  - {path: metrics.net_income.provenance, op: eq, value: parsed}
lineage_required: true
