case: ge_2017_10k_original
tool: get_fundamentals
description: >
  GE fiscal-2017 fundamentals as known on 2018-02-28 must return the ORIGINAL figures from
  the FY2017 10-K (filed Feb 2018), not the values GE later restated. This is the core
  point-in-time guarantee for fundamentals.
provenance: |
  General Electric filed its FY2017 Form 10-K in late February 2018. GE subsequently
  restated prior-period results (insurance reserve charge disclosed Jan 2018; ASC 606 and
  other restatements through 2018-2019). On 2018-02-28 only the original 10-K existed, so a
  point-in-time query for that date must return the original values with lineage pointing at
  the original 10-K accession.
  # VERIFY before finalizing: exact original FY2017 revenue/net-income figures and the
  # original 10-K accession number, against EDGAR (CIK 0000040545).
request:
  ticker: GE
  as_of_date: "2018-02-28"
  metrics: [revenue, net_income]
  fiscal_year: 2017
  fiscal_period: FY
expect:
  - {path: metrics.revenue.fiscal_year, op: eq, value: 2017}
  - {path: metrics.revenue.fiscal_period, op: eq, value: FY}
  - {path: metrics.revenue.value, op: exists}
  - {path: metrics.revenue.source_accession, op: exists,
     source: "original FY2017 10-K, EDGAR CIK 0000040545"}
  - {path: metrics.revenue.methodology_version, op: exists}
lineage_required: true
