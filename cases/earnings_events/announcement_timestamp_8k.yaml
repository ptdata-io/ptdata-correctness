case: announcement_timestamp_8k
tool: get_earnings_event
description: >
  For a recent earnings event, the reported SEC acceptance timestamp must be exact (to the
  second) and internally consistent with the linked 8-K filing's acceptance_datetime, and
  the dissemination-time handling (wire/press-release time + confidence flag) must be present.
provenance: |
  This case pins the timestamp contract. Apple's FY2023 Q4/annual results 8-K (Item 2.02)
  was accepted by EDGAR at 2023-11-02T20:30:32Z (16:30:32 ET, just after the close;
  accession 0000320193-23-000104, items 2.02,9.01 — verified against EDGAR). ptdata's
  earnings-event sec_acceptance_ts must equal that to the second and match the linked 8-K's
  acceptance_datetime (cross-field consistency). Crucially, sec_acceptance_ts is the FILING
  acceptance, not necessarily the market-dissemination time — so dissemination_confidence
  must be present and distinguished (currently 'unknown' pending the options/wire work, 6f).
  Attributed to FY because the announcement accompanies the annual report (see docs/06).
  As-reported FY2023 net sales were $383,285,000,000 (Apple FY ended 2023-09-30).
request:
  ticker: AAPL
  fiscal_year: 2023
  fiscal_period: FY
expect:
  - {path: sec_acceptance_ts, op: eq, value: "2023-11-02T20:30:32Z",
     source: "AAPL 8-K Item 2.02 EDGAR acceptance, accn 0000320193-23-000104"}
  - {path: filing_accession, op: eq, value: "0000320193-23-000104",
     source: "AAPL 8-K Item 2.02, 2023-11-02"}
  - {path: as_reported.revenue, op: eq, value: 383285000000,
     source: "AAPL FY2023 10-K/press release net sales"}
  - {path: dissemination_confidence, op: exists}
cross:
  # The event timestamp must match the linked filing's acceptance time exactly.
  - {left: "sec_acceptance_ts", op: eq, right: "filing.acceptance_datetime"}
lineage_required: true
