case: meta_2021_q4_miss
skip: "requires options-implied expected move (6f); out of MVP scope"
tool: get_earnings_event
description: >
  Meta Platforms Q4 2021 (announced after close 2022-02-02): assert the 8-K acceptance
  timestamp, as-reported revenue, and the pre-announcement options-implied expected move.
provenance: |
  Meta reported Q4 2021 on 2022-02-02 after the close; revenue ~$33.67B. Ticker was FB at
  the time (renamed META 2022-06-09) — the security-identifier history must resolve FB for
  this date. ptdata does not serve a realized price reaction.
  # VERIFY: exact as-reported revenue/EPS against the 2022-02-02 press release / 8-K.
request:
  ticker: FB
  fiscal_year: 2021
  fiscal_period: Q4
expect:
  - {path: sec_acceptance_ts, op: exists}
  - {path: filing_accession, op: exists, source: "Meta/FB 8-K Item 2.02, 2022-02-02"}
  - {path: as_reported.revenue, op: approx, value: 33.67e9, tol: 0.03,
     source: "Meta Q4 2021 press release"}
  - {path: implied_expectation.expected_move_pct, op: exists}
lineage_required: true
